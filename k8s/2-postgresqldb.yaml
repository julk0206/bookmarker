apiVersion: v1
kind: PersistentVolume  # 종류 PV 사용

metadata:
  name: postgres-pv # psotgres-pv 이름

spec:
  capacity:
    storage: 2Gi # 2 GigaByte
  accessModes:
    - ReadWriteOnce # 한 노드에서 하나의 Pod만 읽기/쓰기
  storageClassName: standard
  hostPath:
    path: /data/db # 저장 공간 물리적 위치 지정 (Kind에 docker-container 내부)

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pv-claim

spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi # 최대 크기 PV 넘어갈 수 없음
  storageClassName: standard

---

apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
spec:
  type: ClusterIP
  selector:
    app: postgres-pod
  ports:
    - port: 5432
      targetPort: 5432


---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-pod

  template:
    metadata:
      labels:
        app: postgres-pod

    spec:
      containers:
      - name: postgres
        image: postgres:14-alpine
        ports:
          - containerPort: 5432
        env:
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: bookmark-secrets
                key: postgres_username
                
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: bookmark-secrets
                key: postgres_password

          - name: POSTGRES_DB
            valueFrom:
              configMapKeyRef:
                name: bookmarker-config
                key: postgres_dbname
        
        volumeMounts:
          - name: postgres-storage
            mountPath: /var/lib/postgresql/data
      volumes: 
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pv-claim
          





