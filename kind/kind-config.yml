kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sb-k8s-series # 클러스터 이름

nodes:
  # Master Node (Control Plane)
  - role: control-plane         # 이 노드를 컨트롤 플레인으로 지정
    kubeadmConfigPatches:       # kubeadm 설정을 패치에 추가 구성
    - |
      kind: InitConfiguration 
      nodeResistration:       
        kubeletExtraArgs:      
          node-lables: "ingress-ready=true"  


    extraPortMappings: # 호스트와 컨테이너 간 포트 매핑 설정
      - containerPort: 80 # Service가 노출될 NodePort, 컨테이너 내부 포트(HTTP)
        hostPort: 80 # 외부에서 접속하는 포트 (호스트 포트) 80으로 매핑 -> 브라우저에서 localhost:80 접근 가능
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30090
        hostPort: 18080 # 호스트 포트 18080 -> SpringBoot 8080 의 컨테이너 포트
        protocol: TCP
      - containerPort: 30080 # 호스트 포트 30080 -> Next.jsx 3000 포트
        hostPort: 30080
        protocol: TCP